services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kingsforth_payload
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kingsforth_payload"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kingsforth_payload
      - NODE_ENV=production
    volumes:
      - mediadata:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "yes 2>/dev/null | npm run payload migrate; npm run start"

  swagger:
    build: .
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      - DATABASE_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kingsforth_payload
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    command: npm run swagger

volumes:
  pgdata:
  mediadata:
